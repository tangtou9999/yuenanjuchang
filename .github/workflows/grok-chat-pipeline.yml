# 历史实验，非生产入口。禁止自动启动；仅在用户另行明确要求时恢复。
name: 历史实验｜暂停云端渲染

on:
  workflow_dispatch:
    inputs:
      episode:
        required: true
        default: Z003
      mode:
        type: choice
        options: [preview, full]
        default: preview

permissions:
  contents: read

jobs:
  validate:
    if: ${{ false }} # 用户要求停止新部署，保留历史代码
    name: 校验修复版渲染器
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 检查源码并运行单元测试
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow==13.0.0 numpy==2.5.5
          unzip -q grok-migration/themes/cartoon_c_v05/vn_theater_themeC_v05_20261125.zip
          patch -p1 < grok-migration/themes/cartoon_c_v05/chat_viewport_clipfix.patch
          cd vn_theater
          python -m compileall -q .
          python -m unittest discover -s tests -v

  render:
    name: 私有云盘 MP3＋JSON → 渲染 → 上传云盘
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EPISODE_CODE: ${{ inputs.episode }}
      GOOGLE_DRIVE_SA_JSON: ${{ secrets.GOOGLE_DRIVE_SA_JSON }}
      VN_INPUT_FOLDER_ID: ${{ secrets.VN_INPUT_FOLDER_ID }}
      VN_OUTPUT_FOLDER_ID: ${{ secrets.VN_OUTPUT_FOLDER_ID }}
      VN_AVATARS_ZIP_ID: ${{ secrets.VN_AVATARS_ZIP_ID }}
      VN_BGM_ZIP_ID: ${{ secrets.VN_BGM_ZIP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: grok-migration/requirements-actions.txt
      - name: 核验参数及独立云盘授权
        shell: bash
        run: |
          [[ "$EPISODE_CODE" =~ ^(EP|R|Z)[0-9]{1,5}$ ]] || { echo "集号格式不对"; exit 1; }
          for variable in GOOGLE_DRIVE_SA_JSON VN_INPUT_FOLDER_ID VN_OUTPUT_FOLDER_ID VN_AVATARS_ZIP_ID VN_BGM_ZIP_ID; do
            [[ -n "${!variable}" ]] || { echo "缺少仓库 Secret: $variable"; exit 1; }
          done
      - name: 安装FFmpeg/字体/渲染依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji
          unzip -q grok-migration/themes/cartoon_c_v05/vn_theater_themeC_v05_20261125.zip
          patch -p1 < grok-migration/themes/cartoon_c_v05/chat_viewport_clipfix.patch
          pip install -r vn_theater/requirements.txt google-api-python-client google-auth
      - name: 从私人云盘读取匹配版本的 MP3＋JSON 和人物素材
        run: |
          python vn_theater/tools/drive_pipeline.py fetch \
            --episode "$EPISODE_CODE" \
            --input-folder "$VN_INPUT_FOLDER_ID" \
            --avatars-zip "$VN_AVATARS_ZIP_ID" \
            --bgm-zip "$VN_BGM_ZIP_ID" \
            --root "$GITHUB_WORKSPACE"
      - name: C v05 真实静帧预览
        if: inputs.mode == 'preview'
        working-directory: vn_theater
        run: |
          python run_episode.py "incoming/${EPISODE_CODE}_render.json" "incoming/${EPISODE_CODE}_audio.mp3" --stem "$EPISODE_CODE" --no-align --style chat_final --still 13 --no-cover --no-endcard --no-cover-hold --outdir "$GITHUB_WORKSPACE/preview"
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'preview'
        with:
          name: cartoon-c-v05-preview-${{ github.run_id }}
          path: preview/
          if-no-files-found: error
      - name: 运行当前正式群聊渲染器（含Whisper校准）
        if: inputs.mode == 'full'
        working-directory: vn_theater
        run: |
          python run_episode.py \
            "incoming/${EPISODE_CODE}_render.json" \
            "incoming/${EPISODE_CODE}_audio.mp3" \
            --stem "$EPISODE_CODE" \
            --style chat_final --no-cover-hold --no-endcard --no-cover \
            --outdir "$GITHUB_WORKSPACE/output/$EPISODE_CODE"
      - name: 验证MP4编码、时长、画面尺寸
        if: inputs.mode == 'full'
        run: |
          python - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          code=os.environ["EPISODE_CODE"]
          movie=Path("output")/code/(code+".mp4")
          assert movie.is_file() and movie.stat().st_size>10000, "No complete MP4"
          p=subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(movie)],text=True)
          info=json.loads(p); streams=info["streams"]
          v=next(s for s in streams if s["codec_type"]=="video")
          a=next(s for s in streams if s["codec_type"]=="audio")
          assert (v["width"],v["height"],v["codec_name"])==(1080,1920,"h264")
          assert a["codec_name"]=="aac"
          expected=json.load(open(Path("vn_theater/incoming")/(code+"_render.json"),encoding="utf-8"))["total_audio_duration_sec"]
          actual=float(info["format"]["duration"])
          assert abs(actual-float(expected))<3, f"Duration mismatch: {actual} vs {expected}"
          print(f"MP4 technical check OK: {code}, {actual:.2f}s")
          PY
      - name: 回传 Google Drive（不会覆盖旧视频）
        if: inputs.mode == 'full'
        run: |
          python vn_theater/tools/drive_pipeline.py upload \
            --episode "$EPISODE_CODE" \
            --output-folder "$VN_OUTPUT_FOLDER_ID" \
            --video "output/$EPISODE_CODE/$EPISODE_CODE.mp4" \
            --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: success() && inputs.mode == 'full'
        with:
          name: ${{ inputs.episode }}-render-${{ github.run_id }}
          path: output/${{ inputs.episode }}/${{ inputs.episode }}.mp4
          retention-days: 7
