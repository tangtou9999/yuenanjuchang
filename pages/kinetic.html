function clamp(x,a,b){return x<a?a:x>b?b:x;}

    var sc4=.6+.4*ob(u4/.35);ctx.save();ctx.translate(270,245);ctx.scale(sc4,sc4);T('5 年',0,0,165,['#FFFFFF','#8FA6FF'],{glow:'#7B5CFF',gb:40});ctx.restore();
    // timeline
    var bx0=50,bx1=490,by=425,pr=ei((u4-.05)/1.1);

    var xh=bx0+(bx1-bx0)*pr;circle(xh,by,13,'#fff');circle(xh,by,22,null,'rgba(255,255,255,.5)',3);
    T(String(2027+Math.floor(pr*5+.0001)),xh,by-46,40,'#FFD600',{en:1,glow:'#FFD600',gb:16});
    ctx.restore();
    if(u4<.35){ctx.save();ctx.globalAlpha=.9*(1-u4/.35);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore();}

    T('只要你熟练掌握',270-0,125-30*(1-eo(u5/.3)),46,'#fff',{glow:'#00E5FF',gb:12});
    var s5=.5+.5*ob(u5/.4);ctx.save();ctx.translate(270,225);ctx.scale(s5,s5);T('AI',0,0,150,['#00E5FF','#C400FF'],{en:1,glow:'#00E5FF',gb:34});ctx.restore();

    var g5=ctx.createLinearGradient(70,0,470,0);g5.addColorStop(0,'#B2FF59');g5.addColorStop(1,'#00E5FF');ctx.save();ctx.beginPath();ctx.roundRect(70,318,400*pr5,30,15);ctx.fillStyle=g5;ctx.shadowColor='#00E5FF';ctx.shadowBlur=18;ctx.fill();ctx.restore();
    T('熟练度',70,298,22,'#C8D3FF',{align:'left'});T(Math.floor(pr5*100)+'%',470,298,26,'#fff',{align:'right',en:1});

/* ===================== VERSION B: yellow-black poster punch ===================== */
var Y='#FFD60A',K='#0B0B0B',RD='#FF2E2E',BL='#1E40FF';
function bgB(t){
  ctx.fillStyle=Y;ctx.fillRect(-40,-40,W+80,H+80);
